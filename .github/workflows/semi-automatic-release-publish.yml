name: semi-automatic-release-publish

on:
  workflow_dispatch:
    inputs:
      ring_type:
        description: 'Select build ring'
        type: choice
        required: true
        default: 'fast'
        options:
          - 'fast'
          - 'slow'
      version:
        description: 'Version number (e.g., 2.1.0)'
        type: string
        required: true
      changelog:
        description: 'Release notes (optional)'
        type: string
        default: '开发人员忘写更新日志了！快去提醒 TA 吧！'
        required: false

jobs:
  build:
    name: Build ${{ inputs.ring_type == 'fast' && 'Beta' || 'Release' }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - architecture: x64
            os: windows-latest
          - architecture: ARM64
            os: self-hosted
      fail-fast: false

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ring_type == 'fast' && 'beta' || 'main' }}  # 动态分支切换

    - name: Determine Configuration
      shell: bash
      run: |
        echo "CONFIGURATION=${{ inputs.ring_type == 'fast' && 'Beta' || 'Release' }}" >> $GITHUB_ENV

    - name: Set Describe
      shell: powershell
      run: |
        $describe = $(git describe --tags --always)
        echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: ${{ matrix.architecture }}

    - name: Update Help Docs
      shell: powershell
      run: |
        $helpPath = "${{ github.workspace }}\Plain Craft Launcher 2\Resources\Help.zip"
        Remove-Item -Path $helpPath -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path "${{ github.workspace }}\_temp" -Force
        cd "${{ github.workspace }}\_temp"
        git clone https://github.com/PCL-Community/PCL2CEHelp -b master --depth 1
        Compress-Archive -Path ".\PCL2CEHelp\*" -DestinationPath $helpPath
        cd ${{ github.workspace }}
        Remove-Item -Recurse -Force "${{ github.workspace }}\_temp"

    - name: Restore NuGet Packages
      run: nuget restore "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -PackagesDirectory "packages"

    - name: Inject Secrets
      shell: powershell
      run: |
        # 统一替换密钥和提交哈希
        $secretFile = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $baseFile = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $aboutFile = "Plain Craft Launcher 2\Pages\PageOther\PageOtherAbout.xaml"

        (Get-Content $secretFile) `
          -replace 'Public Const OAuthClientId As String = ""', 'Public Const OAuthClientId As String = "${{ secrets.CLIENT_ID }}"' `
          -replace 'Public Const CurseForgeAPIKey As String = ""', 'Public Const CurseForgeAPIKey As String = "${{ secrets.CURSEFORGE_API_KEY }}"' `
          -replace 'Public Const LittleSkinClientId As String = ""', 'Public Const LittleSkinClientId As String = "${{ secrets.LITTLESKIN_CLIENT_ID }}"' |
        Set-Content $secretFile

        (Get-Content $baseFile) `
          -replace 'Public Const CommitHash As String = "native"', "Public Const CommitHash As String = '${{ github.sha }}'" |
        Set-Content $baseFile

        (Get-Content $aboutFile) `
          -replace 'https://github.com/PCL-Community/PCL2-CE', "https://github.com/PCL-Community/PCL2-CE/tree/${{ github.sha }}" |
        Set-Content $aboutFile

    - name: Build Project
      shell: powershell
      run: |
        $outputName = "PCL2-${{ env.CONFIGURATION }}-${{ matrix.architecture }}.exe"
        msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" `
          -p:Configuration=${{ env.CONFIGURATION }} `
          -p:Platform=${{ matrix.architecture }} `
          -p:OutDir="bin\${{ matrix.architecture }}\" `
          -p:AssemblyName=$outputName

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.architecture }}
        path: |
          Plain Craft Launcher 2\bin\${{ matrix.architecture }}\*.exe
          Plain Craft Launcher 2\bin\${{ matrix.architecture }}\*.pdb
        retention-days: 1
        if-no-files-found: error

  create-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*

      - name: Verify Artifact Structure
        run: |
          echo "=== Artifact Directory Tree ==="
          find artifacts -type f -print
          echo "=============================="

      - name: Generate Release Notes
        shell: bash
        run: |
          RELEASE_BODY="${{ inputs.changelog }}"
          if [ -z "$RELEASE_BODY" ]; then
            RELEASE_BODY="开发人员忘写更新日志了！快去提醒 TA 吧！"
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.BOT }}
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ inputs.ring_type == 'fast' && 'beta' || 'main' }}
          name: ${{ inputs.version }}
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ inputs.ring_type == 'fast' }}
          files: |
            artifacts/**/*
          draft: false
